# Additional loggers to configure (the root logger is always configured)
loggers=org.jboss.resteasy,dev.resteasy

logger.level=INFO
logger.handlers=FILE,CONSOLE

logger.org.jboss.resteasy.level=${test.log.level:INFO}
logger.dev.resteasy.level=${test.log.level:INFO}

handler.CONSOLE=org.jboss.logmanager.handlers.ConsoleHandler
handler.CONSOLE.formatter=${test.log.console.formatter:CONSOLE-PATTERN}
handler.CONSOLE.properties=autoFlush,target
handler.CONSOLE.autoFlush=true
handler.CONSOLE.target=SYSTEM_OUT

handler.FILE=org.jboss.logmanager.handlers.FileHandler
handler.FILE.formatter=PATTERN
handler.FILE.properties=autoFlush,append,fileName
handler.FILE.constructorProperties=fileName,append
handler.FILE.autoFlush=true
handler.FILE.append=true
handler.FILE.fileName=${client.log.dir}/tck-client.log

formatter.COLOR-PATTERN=org.jboss.logmanager.formatters.ColorPatternFormatter
formatter.COLOR-PATTERN.properties=pattern
formatter.COLOR-PATTERN.pattern=[client] %d{HH\:mm\:ss,SSS} %-5p [%c] (%t) %s%e%n

formatter.PATTERN=org.jboss.logmanager.formatters.PatternFormatter
formatter.PATTERN.properties=pattern
formatter.PATTERN.pattern=%d{yyyy-MM-dd'T'HH\:mm\:ss,SSS} %-5p [%c] (%t) %s%e%n

formatter.CONSOLE-PATTERN=org.jboss.logmanager.formatters.PatternFormatter
formatter.CONSOLE-PATTERN.properties=pattern
formatter.CONSOLE-PATTERN.pattern=[client] %d{yyyy-MM-dd'T'HH\:mm\:ss,SSS} %-5p [%c] (%t) %s%e%n